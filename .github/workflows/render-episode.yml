name: Render autonomous episode

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Deterministic episode seed
        required: true
        default: '20260916'
      population:
        description: Number of residents
        required: true
        default: '30'
      days:
        description: Simulated days
        required: true
        default: '7'
  push:
    paths:
      - 'render-request.txt'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Resolve episode settings
        id: episode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            seed='${{ inputs.seed }}'
            population='${{ inputs.population }}'
            days='${{ inputs.days }}'
          else
            seed=$(sed -n 's/^seed=//p' render-request.txt | head -n1)
            population=$(sed -n 's/^population=//p' render-request.txt | head -n1)
            days=$(sed -n 's/^days=//p' render-request.txt | head -n1)
          fi

          [[ "$seed" =~ ^[0-9]+$ ]] || { echo "Invalid seed"; exit 1; }
          [[ "$population" =~ ^[0-9]+$ ]] || { echo "Invalid population"; exit 1; }
          [[ "$days" =~ ^[0-9]+$ ]] || { echo "Invalid days"; exit 1; }

          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "population=$population" >> "$GITHUB_OUTPUT"
          echo "days=$days" >> "$GITHUB_OUTPUT"

      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            xvfb \
            libasound2-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxcursor-dev \
            libxinerama-dev

      - name: Configure
        run: cmake -S . -B build -DSIMULATION_BUILD_VIEWER=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Generate complete autonomous episode
        run: |
          xvfb-run -a ./build/simulation_episode \
            '${{ steps.episode.outputs.seed }}' \
            '${{ steps.episode.outputs.population }}' \
            '${{ steps.episode.outputs.days }}' \
            episode-output
          test -s episode-output/mason-block.mp4
          test -s episode-output/mason-block-ambience.wav
          test -s episode-output/episode.json
          test -s episode-output/timeline.txt

      - name: Upload episode
        uses: actions/upload-artifact@v4
        with:
          name: mason-block-seed-${{ steps.episode.outputs.seed }}
          path: |
            episode-output/mason-block.mp4
            episode-output/mason-block-ambience.wav
            episode-output/episode.json
            episode-output/timeline.txt
          if-no-files-found: error
          retention-days: 14
